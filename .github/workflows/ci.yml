name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # I test degli ingressi generano MKV veri (CONTRIBUTING.md, "Sviluppo").
      - name: Install ffmpeg and mkvtoolnix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - run: mkvmerge --version && ffprobe -version | head -n 1
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Ogni PR alza la versione e la descrive nel CHANGELOG (CONTRIBUTING.md).
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch --depth=1 origin "${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "origin/${{ github.base_ref }}"
