<svg xmlns="http://www.w3.org/2000/svg" width="880" height="464" viewBox="0 0 880 464" role="img" aria-label="dyadrr analyze">
  <title>dyadrr analyze</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 14px; white-space: pre; }
    .p { fill: #7ee787; font-weight: bold; } .c { fill: #f0f6fc; } .o { fill: #c9d1d9; } .m { fill: #8b949e; } .t { fill: #8b949e; font-size: 13px; }
  </style>
  <rect width="880" height="464" rx="10" fill="#0d1117"/>
  <rect width="880" height="32" rx="10" fill="#161b22"/>
  <rect y="22" width="880" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="440" y="21" text-anchor="middle" class="t">dyadrr analyze</text>
  <text x="20" y="58"><tspan class="p">$</tspan><tspan class="c"> dyadrr analyze &quot;Faro di Velmora (2011) [BD ITA].mkv&quot; &quot;Faro di Velmora (2011) [UHD].mkv&quot; --report \</tspan></text>
  <text x="20" y="78" class="c">    analisi.json</text>
  <text x="20" y="98" class="o">/media/film/analisi.json</text>
  <text x="20" y="118"><tspan class="p">$</tspan><tspan class="c"> echo $?</tspan></text>
  <text x="20" y="138" class="o">0</text>
  <text x="20" y="158"><tspan class="p">$</tspan><tspan class="c"> jq '{decision, roles: {reference: .roles.reference, donor: .roles.donor}, \</tspan></text>
  <text x="20" y="178" class="c">    offsetMs: .measurement.offset.offsetMs, checkpoints: (.measurement.checkpoints | length), \</text>
  <text x="20" y="198" class="c">    pending: .plan.pending, warnings: [.warnings[].code]}' analisi.json</text>
  <text x="20" y="218" class="o">{</text>
  <text x="20" y="238" class="o">  &quot;decision&quot;: &quot;eligible&quot;,</text>
  <text x="20" y="258" class="o">  &quot;roles&quot;: {</text>
  <text x="20" y="278" class="o">    &quot;reference&quot;: 1,</text>
  <text x="20" y="298" class="o">    &quot;donor&quot;: 0</text>
  <text x="20" y="318" class="o">  },</text>
  <text x="20" y="338" class="o">  &quot;offsetMs&quot;: 1500,</text>
  <text x="20" y="358" class="o">  &quot;checkpoints&quot;: 30,</text>
  <text x="20" y="378" class="o">  &quot;pending&quot;: [],</text>
  <text x="20" y="398" class="o">  &quot;warnings&quot;: []</text>
  <text x="20" y="418" class="o">}</text>
  <text x="20" y="438" class="m"># roles: posizione dei file nel comando (0 il primo); offsetMs: lo spostamento S misurato</text>
</svg>
