  <text x="20" y="58"><tspan class="p">$</tspan><tspan class="c"> dyadrr analyze &quot;Isola Chiusa (2010) [BD ITA].mkv&quot; &quot;Faro di Velmora (2011) [UHD].mkv&quot; --report \</tspan></text>
